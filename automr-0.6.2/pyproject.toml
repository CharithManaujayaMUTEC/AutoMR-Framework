[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automr"
version = "0.6.2"
description = "A Modular Model-Agnostic Metamorphic Testing Framework for AI/ML Model Robustness Validation"
readme = "README.md"
requires-python = ">=3.8"

license = { text = "MIT" }

authors = [
  { name = "Charith Manujaya" },
  { name = "Raveesha Peiris" },
  { name = "Thurunu Pabasara" },
  { name = "Tharika Akurana" }
]

keywords = [
  "metamorphic testing",
  "machine learning",
  "deep learning",
  "autonomous driving",
  "robustness testing",
  "model validation",
  "computer vision",
  "regression",
  "software testing",
  "AI testing",
  "metamorphic relations",
  "epsilon sensitivity",
  "plugin architecture",
  "transformation registry"
]

classifiers = [
  "Development Status :: 4 - Beta",

  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",

  "License :: OSI Approved :: MIT License",

  "Operating System :: OS Independent",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",

  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "opencv-python>=4.5",
  "tqdm>=4.60",
  "tensorflow>=2.10",
  "python-dotenv>=1.0"
]

[project.urls]
Homepage = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Repository = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Documentation = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/wiki"
Issues = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/issues"

[tool.setuptools.packages.find]
include = ["automr*"]
exclude = [
  "results*",
  "examples*",
  "tests*",
  "notebooks*",
  "logs*"
]