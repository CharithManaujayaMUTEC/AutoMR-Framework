[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automr"
version = "0.1.0"
description = "Metamorphic Testing Framework for Regression-based Autonomous Driving ML/AI Models"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
  { name="Charith Manujaya" },
  { name="Raveesha Peiris" },
  { name="Thurunu Pabasara" },
  { name="Tharika Akurana" }
]

dependencies = [
  "numpy",
  "pandas",
  "tqdm",
  "opencv-python",
  "tensorflow",
  "python-dotenv"
]

[project.urls]
Homepage = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"

[tool.setuptools.packages.find]
include = ["automr*"]
exclude = ["results*", "notebooks*"]