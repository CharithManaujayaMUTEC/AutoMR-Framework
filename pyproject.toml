[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automr"
version = "1.1.1"

description = "A Model-Agnostic Metamorphic Testing Framework for Regression-Based AI/ML Models with High-Performance Parallel Validation"

readme = "README.md"

requires-python = ">=3.8"

license = { text = "MIT" }

authors = [
  { name = "Charith Manujaya" },
  { name = "Raveesha Peiris" },
  { name = "Thurunu Pabasara" },
  { name = "Tharika Akurana" }
]

keywords = [
  "metamorphic testing",
  "machine learning",
  "deep learning",
  "artificial intelligence",
  "ai testing",
  "model validation",
  "robustness testing",
  "autonomous driving",
  "computer vision",
  "regression",
  "image processing",
  "software testing",
  "parallel computing",
  "high performance computing",
  "batch inference",
  "prediction caching",
  "epsilon sensitivity",
  "parameter range testing",
  "failure analysis",
  "plugin architecture",
  "transformation registry",
  "metamorphic relations",
  "reliability testing",
  "verification",
  "validation"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: Pytest"
]

dependencies = [
  # Core scientific computing
  "numpy>=1.26.4,<2.0",
  "pandas>=2.2.2",
  "scipy>=1.13.1",

  # Image processing
  "opencv-python>=4.10.0",
  "Pillow>=10.4.0",
  "scikit-image>=0.24.0",
  "imageio>=2.37.0",

  # Visualization
  "matplotlib>=3.9.0",
  "seaborn>=0.13.2",

  # Deep Learning
  "tensorflow>=2.19.0",
  "tensorboard>=2.19.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",

  # Traditional ML
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",

  # ONNX Support
  "onnx>=1.18.0",
  "onnxruntime>=1.22.0",

  # Image augmentations & transforms
  "kornia>=0.7.3",
  "noise>=1.2.2",

  # Utilities
  "tqdm>=4.67.1",
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "typing-extensions>=4.12.2",
  "addict>=2.4.0",
  "pathspec>=0.12.1",
  "packaging>=24.2",
  "psutil>=6.1.1",
  "joblib>=1.4.2",
  "networkx>=3.4.2"
]

[project.urls]
Homepage = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Repository = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Documentation = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/wiki"
Issues = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/issues"
Changelog = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/releases"

[tool.setuptools.packages.find]
include = ["automr*"]

exclude = [
  "results*",
  "results_hpc*",
  "examples*",
  "tests*",
  "notebooks*",
  "logs*",
  "docs*",
  "benchmarks*"
]