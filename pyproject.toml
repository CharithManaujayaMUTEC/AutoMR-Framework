[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automr"
version = "0.2.0"

description = "Model-Agnostic Metamorphic Testing Framework for Regression-Based Autonomous Driving Models"

readme = "README.md"

requires-python = ">=3.8"

license = { text = "MIT" }

authors = [
  { name = "Charith Manujaya" },
  { name = "Raveesha Peiris" },
  { name = "Thurunu Pabasara" },
  { name = "Tharika Akurana" }
]

keywords = [
  "metamorphic testing",
  "machine learning",
  "autonomous driving",
  "model testing",
  "robustness",
  "validation",
  "ai testing",
  "regression"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing"
]

dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "tqdm>=4.60",
  "opencv-python>=4.5",
  "tensorflow>=2.10",
  "python-dotenv>=1.0"
]

[project.urls]
Homepage = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Repository = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework"
Issues = "https://github.com/CharithManaujayaMUTEC/AutoMR-Framework/issues"

[tool.setuptools.packages.find]
include = ["automr*"]
exclude = [
  "results*",
  "notebooks*",
  "tests*",
  "examples*",
  "logs*"
]